name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: clippy, rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: release
        run: cargo build --release

  # Independent of the rust job: integration/Dockerfile compiles consoled
  # itself inside a Debian 12 image, so no host-built artifact is needed and
  # both jobs can run in parallel.
  # Runs natively on x86_64 and arm64 so the seccomp allowlist is exercised
  # on both syscall tables.
  integration:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build integration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: integration/Dockerfile
          tags: consoled-it
          load: true
          cache-from: type=gha,scope=integration-${{ matrix.runner }}
          cache-to: type=gha,scope=integration-${{ matrix.runner }},mode=max
      - name: containerized login tests
        run: docker run --rm --privileged consoled-it
